<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Ledger</title>
<link rel="icon" href="data:,">

<!-- Tailwind (utility classes, no build step needed) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React (no build step needed) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
  body { margin: 0; }
  .sl-display { font-family: 'Fraunces', serif; }
  .sl-body { font-family: 'IBM Plex Sans', sans-serif; }
  .sl-mono { font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.04em; }
  .sl-card { box-shadow: 0 1px 0 rgba(27,27,27,0.06), 0 8px 20px -12px rgba(27,27,27,0.25); }
</style>

<script>
  window.onerror = function (msg, url, line, col, error) {
    document.getElementById('root').innerHTML =
      '<div style="max-width:600px;margin:60px auto;padding:20px;font-family:monospace;background:#fff3f3;border:1px solid #e0a0a0;border-radius:6px;white-space:pre-wrap;">' +
      '<strong>Something went wrong loading the app:</strong>\n\n' + msg + '\n(line ' + line + ')' +
      '</div>';
  };
</script>
</head>
<body>
<div id="root"></div>

<script src="firebase-config.js?v=2"></script>
<script type="text/babel" data-presets="react" src="app.js?v=2"></script>
</body>
</html>
